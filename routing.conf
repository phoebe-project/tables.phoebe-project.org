# Mounted read-only into the router and read ONCE at startup; edit + restart
# the router (or the whole stack) to apply.
#
#   [backends]    routing key "major.minor" -> backend base URL
#   [settings]    default = backend for version-less / 'latest' / unhosted reqs
#   [exceptions]  key is a case-insensitive substring matched against the full
#                 phoebe_version BEFORE numeric parsing; file order = first match
#                 wins. e.g. "2.4.22+feature-blending" -> 2.5 though it parses 2.4.
#
# NOTE: URLs use docker-compose SERVICE NAMES, not host IP:port. All three
# services share the compose network and resolve each other by service name,
# which removes the host-port coupling entirely. Keep service names dot-free
# (server-24, not server-2.4) so Docker DNS resolves cleanly; the routing KEY
# below still uses the dotted "2.4".

[backends]
2.4 = http://server-24:80
2.5 = http://server-25:80

[settings]
default = 2.5

[exceptions]
feature-blending = 2.5
