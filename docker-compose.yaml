services:
    tables:
        build:
            context: .
            dockerfile: Dockerfile
        image: phoebe-tables:latest
        pull_policy: never
        container_name: phoebe-tables-server
        ports:
            - "${HOST_IP}:${HOST_PORT}:80"
        volumes:
            - ./data:/tables/data:ro
        deploy:
            resources:
                limits:
                    memory: ${MEMORY_LIMIT}
        environment:
            PHOEBE_ENABLE_ONLINE_PASSBANDS: FALSE
            FLASK_DEBUG: "0"
            LOG_LEVEL: info
            GUNICORN_CMD_ARGS: >-
                --workers 2
                --worker-class sync
                --timeout 120
                --graceful-timeout 120
                --keep-alive 60
                --max-requests 1000
                --max-requests-jitter 10
                --log-level info
                --access-logfile -
                --error-logfile -
        restart: unless-stopped

