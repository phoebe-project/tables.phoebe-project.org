<VirtualHost _default_:443>
    ServerName router.phoebe-project.org
    ServerAdmin aprsa@villanova.edu

    SSLEngine               on
    SSLCertificateFile "/etc/ssl/certs/phoebe-project.fullchain.pem"
    SSLCertificateKeyFile "/etc/ssl/private/phoebe-project.key"

    Protocols               h2 http/1.1
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1

    ProxyPreserveHost On
    ProxyRequests     Off
    # timeout must comfortably exceed the router's READ_TIMEOUT (600s) and the
    # router's gunicorn --timeout, so a slow passband build is never cut off.
    ProxyPass         / http://192.168.1.109:8084/ connectiontimeout=5 timeout=900 keepalive=On
    ProxyPassReverse  / http://192.168.1.109:8084/

    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Host "router.phoebe-project.org"
    RemoteIPHeader X-Forwarded-For

    # --- response caching -------------------------------------------------
    # Safe here because the cache key includes the query string (default), and
    # the query string carries phoebe_version + content + gzipped -- so every
    # distinct (version, passband, content, gzipped) tuple caches separately
    # and there is no cross-version mixing. Version-less requests resolve to
    # the default (latest) backend consistently; the only stale case is when
    # "latest" rolls over (e.g. 2.5 -> 2.6), at which point flush the cache.
    CacheQuickHandler Off
    CacheEnable disk /
    CacheRoot /var/cache/apache2/mod_cache_disk_tables

    # backend responses carry no Last-Modified / Cache-Control / Expires, so we
    # must supply freshness ourselves and tell the cache to accept them:
    CacheIgnoreNoLastMod On
    CacheDefaultExpire 3600
    CacheMaxExpire 86400

    # CRITICAL: the default CacheMaxFileSize is ~1 MB, which would silently
    # refuse to cache the large .fits/.fits.gz downloads -- exactly the
    # expensive-to-generate responses we most want cached. Raise the ceiling.
    CacheMaxFileSize 209715200

    # serialize concurrent identical requests so a single slow generation is
    # not run N times in parallel (thundering-herd protection):
    CacheLock On

    ErrorLog /var/log/apache2/router.phoebe-project.org.errors.log
    CustomLog /var/log/apache2/router.phoebe-project.org.access.log combined
    LogLevel warn
</VirtualHost>

<VirtualHost *:80>
    ServerName router.phoebe-project.org
    Redirect permanent / https://router.phoebe-project.org/
</VirtualHost>
