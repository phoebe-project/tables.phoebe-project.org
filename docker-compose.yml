services:

    # pre-2.5 server:
    server-24:
        build:
            context: ./server
            dockerfile: Dockerfile
            no_cache: true
            args:
                GIT_REMOTE: ${SERVER24_GIT_REMOTE}
                PHOEBE_BRANCH: ${SERVER24_BRANCH}
        image: phoebe-tables:${SERVER24_VERSION}
        pull_policy: never
        container_name: phoebe-tables-${SERVER24_VERSION}-server
        volumes:
            - ${SERVER24_DATA}:/tables/data:ro
        environment:
            PHOEBE_ENABLE_ONLINE_PASSBANDS: "FALSE"
            FLASK_DEBUG: "0"
            LOG_LEVEL: info
            GUNICORN_CMD_ARGS: >-
                --workers 2
                --worker-class sync
                --timeout 120
                --graceful-timeout 120
                --keep-alive 60
                --max-requests 1000
                --max-requests-jitter 10
                --access-logfile -
                --error-logfile -
                --log-level info
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:80/info"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: ${SERVER_MEMORY_LIMIT}
        restart: unless-stopped

    # 2.5 server
    server-25:
        build:
            context: ./server
            dockerfile: Dockerfile
            no_cache: true
            args:
                GIT_REMOTE: ${SERVER25_GIT_REMOTE}
                PHOEBE_BRANCH: ${SERVER25_BRANCH}
        image: phoebe-tables:${SERVER25_VERSION}
        pull_policy: never
        container_name: phoebe-tables-${SERVER25_VERSION}-server
        volumes:
            - ${SERVER25_DATA}:/tables/data:ro
        environment:
            PHOEBE_ENABLE_ONLINE_PASSBANDS: "FALSE"
            FLASK_DEBUG: "0"
            LOG_LEVEL: info
            GUNICORN_CMD_ARGS: >-
                --workers 2
                --worker-class sync
                --timeout 120
                --graceful-timeout 120
                --keep-alive 60
                --max-requests 1000
                --max-requests-jitter 10
                --access-logfile -
                --error-logfile -
                --log-level info
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:80/info"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: ${SERVER_MEMORY_LIMIT}
        restart: unless-stopped

    # router (the only publicly exposed component)
    router:
        build:
            context: ./router
            dockerfile: Dockerfile
            no_cache: true
        image: phoebe-tables-router:${ROUTER_VERSION}
        pull_policy: never
        container_name: phoebe-tables-router
        ports:
            - "${HOST_IP}:${ROUTER_PORT}:80"
        volumes:
            # routing config; it must exist as a FILE before `up` or Docker
            # creates a directory at this path instead of bind-mounting it.
            - ./routing.conf:/router/routing.conf:ro
        environment:
            ROUTING_CONFIG: /router/routing.conf
            CONNECT_TIMEOUT: "5"
            READ_TIMEOUT: "600"
            LOG_LEVEL: info
            GUNICORN_CMD_ARGS: >-
                --worker-class gthread
                --workers 2
                --threads 8
                --timeout 900
                --graceful-timeout 30
                --keep-alive 60
                --access-logfile -
                --error-logfile -
                --log-level info
        # wait until both backends report healthy before starting the router,
        # so it never comes up routing to a backend that isn't ready yet.
        depends_on:
            server-24:
                condition: service_healthy
            server-25:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: ${ROUTER_MEMORY_LIMIT}
        restart: unless-stopped
